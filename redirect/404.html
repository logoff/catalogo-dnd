<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Catálogo D&D se ha mudado a catalogodnd.es</title>
    <link rel="canonical" href="https://catalogodnd.es/" />
    <meta http-equiv="refresh" content="0; url=https://catalogodnd.es/" />
    <script>
      // Conserva la ruta: /catalogo-dnd/producto/2014/phb -> https://catalogodnd.es/producto/2014/phb
      var l = window.location
      var path = l.pathname.replace(/^\/catalogo-dnd/, '') || '/'
      l.replace('https://catalogodnd.es' + path + l.search + l.hash)
    </script>
  </head>
  <body>
    <p>El catálogo se ha mudado a <a href="https://catalogodnd.es/">catalogodnd.es</a>.</p>
  </body>
</html>
