<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#fafafa" />
    <!-- Tema antes de pintar nada, para que el HTML prerenderizado no parpadee.
         Lo mismo que hace src/utils/theme.ts; si se cambia uno, cambiar el otro -->
    <script>
      ;(function () {
        var t
        try {
          t = localStorage.getItem('theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        var r = document.documentElement
        r.setAttribute('data-theme', t)
        r.style.colorScheme = t
        document.querySelector('meta[name="theme-color"]').content =
          t === 'dark' ? '#0a0a0a' : '#fafafa'
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />
    <link rel="apple-touch-icon" href="/images/logo-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Verificación de la web en Impact (programa de afiliados de Humble Bundle) -->
    <meta name="impact-site-verification" value="360a6b3e-2d0a-4a65-bdaa-f7691b0ea57a" />
    <!-- Vista previa genérica: en el build, scripts/prerender.mjs la cambia por la de cada página.
         main.tsx las quita al arrancar y React gestiona las de cada página. -->
    <title data-static-meta>Catálogo D&amp;D 5E</title>
    <meta
      data-static-meta
      name="description"
      content="Todos los libros, cajas y accesorios de Dungeons &amp; Dragons 5E (2014) y 5.5E (2024), en inglés y en castellano, los videojuegos oficiales de D&amp;D y guías para elegir."
    />
    <meta data-static-meta property="og:type" content="website" />
    <meta data-static-meta property="og:site_name" content="Catálogo D&amp;D 5E" />
    <meta data-static-meta property="og:locale" content="es_ES" />
    <meta data-static-meta property="og:title" content="Catálogo D&amp;D 5E" />
    <meta
      data-static-meta
      property="og:description"
      content="Todos los libros, cajas y accesorios de Dungeons &amp; Dragons 5E (2014) y 5.5E (2024), en inglés y en castellano, los videojuegos oficiales de D&amp;D y guías para elegir."
    />
    <meta data-static-meta property="og:image" content="https://catalogodnd.es/images/og.png" />
    <meta data-static-meta property="og:image:width" content="1200" />
    <meta data-static-meta property="og:image:height" content="630" />
    <meta data-static-meta name="twitter:card" content="summary_large_image" />
    <meta data-static-meta name="twitter:image" content="https://catalogodnd.es/images/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
