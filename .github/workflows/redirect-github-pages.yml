name: Redirección desde GitHub Pages

# Publica en logoff.github.io/catalogo-dnd/ una página que redirige cada ruta
# a catalogodnd.es, para no perder los enlaces antiguos. Basta con ejecutarlo una vez.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './redirect'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
