name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Faltan secretos del repositorio:$missing. Añádelos en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Hace falta el commit anterior para ver qué ha cambiado
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_UMAMI_URL: ${{ secrets.UMAMI_URL }}
          VITE_UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
          VITE_AFFILIATE_AMAZON_TAG: ${{ secrets.AFFILIATE_AMAZON_TAG }}
          VITE_AFFILIATE_ADTRACTION_CHANNEL: ${{ secrets.AFFILIATE_ADTRACTION_CHANNEL }}
          VITE_AFFILIATE_GENERACION_X_PROGRAM: ${{ secrets.AFFILIATE_GENERACION_X_PROGRAM }}
          VITE_AFFILIATE_JUEGOS_MESA_REDONDA_PROGRAM: ${{ secrets.AFFILIATE_JUEGOS_MESA_REDONDA_PROGRAM }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=catalogodnd --branch=main --commit-dirty=true

      - name: Check content changes
        id: content
        if: github.event_name == 'push'
        run: |
          if git diff --quiet HEAD~1 HEAD -- data/ src/pages/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Avisa a Bing y al resto de buscadores de IndexNow; si falla, el despliegue ya está hecho
      - name: Notify IndexNow
        if: steps.content.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/indexnow.mjs
